name: BMA Data Relay

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bma-relay.yml"
      - "scripts/bma-relay.mjs"
      - "scripts/road-monitor-enrich.mjs"
      - "scripts/dedupe-water.mjs"
      - "src/lib/bma/relay.ts"
      - "src/lib/overview/adapter.ts"
      - "src/lib/thaiwater/**"

concurrency:
  group: bma-data-relay
  cancel-in-progress: true

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write

    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Fetch BMA and ThaiWater base data
        run: node scripts/bma-relay.mjs /tmp/bma-latest.json

      - name: Deduplicate fallback water stations
        run: node scripts/dedupe-water.mjs /tmp/bma-latest.json

      - name: Enrich requested road monitors
        run: node scripts/road-monitor-enrich.mjs /tmp/bma-latest.json

      - name: Validate relay snapshot before publish
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = '/tmp/bma-latest.json';
          const stat = fs.statSync(p);
          if (stat.size < 2 || stat.size > 2_000_000) throw new Error(`Unexpected relay size: ${stat.size}`);
          const data = JSON.parse(fs.readFileSync(p, 'utf8'));
          for (const key of ['rain', 'water', 'roadFlood']) {
            if (!Array.isArray(data[key])) throw new Error(`Missing array: ${key}`);
            if (data[key].length > 5000) throw new Error(`Too many records in ${key}`);
          }
          if (typeof data.generatedAt !== 'string') throw new Error('Missing generatedAt');
          console.log('Relay snapshot schema/size validation passed.');
          NODE

      - name: Publish relay snapshot
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "thonburi-flood-watch-bot"
          git config user.email "actions@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin bma-cache >/dev/null 2>&1; then
            git fetch origin bma-cache:bma-cache
            git switch bma-cache
          else
            git switch -c bma-cache
          fi

          mkdir -p data
          cp /tmp/bma-latest.json data/bma-latest.json
          git add data/bma-latest.json

          if git diff --cached --quiet; then
            echo "Relay snapshot unchanged."
            exit 0
          fi

          git commit -m "chore(data): refresh BMA relay snapshot"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin bma-cache
