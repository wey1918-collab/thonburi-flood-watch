name: Generate Lockfile

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-lock.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"

      - name: Generate lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-fund --no-audit

      - name: Validate lockfile
        run: |
          node -e "const p=require('./package-lock.json'); if(p.lockfileVersion!==3) process.exit(1); console.log('lockfileVersion',p.lockfileVersion)"

      - name: Commit lockfile
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "thonburi-flood-watch-security-bot"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile unchanged."
            exit 0
          fi
          git commit -m "chore(security): add reproducible npm lockfile"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main
