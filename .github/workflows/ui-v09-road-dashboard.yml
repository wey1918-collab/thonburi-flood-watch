name: Apply V0.9 Road Dashboard

on:
  push:
    branches:
      - main
    paths:
      - "scripts/upgrade-ui-v09.mjs"

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Apply V0.9 dashboard patch
        run: node scripts/upgrade-ui-v09.mjs

      - name: Commit generated UI changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "thonburi-flood-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/LiveDashboardV08.tsx src/app/dashboard-v08.css src/app/page.tsx
          if git diff --cached --quiet; then
            echo "No UI changes required."
            exit 0
          fi
          git commit -m "Upgrade five-road dashboard to five levels"
          git push origin HEAD:main
